---
- name: "Create directories | registry@{{ registry_name }}"
  ansible.builtin.file:
    name: "{{ item }}"
    mode: 0755
    owner: "{{ registry_owner }}"
    group: "{{ registry_group }}"
    state: directory
  loop:
    - "{{ registry_install_dir }}"
    - "{{ registry_config_dir }}"

- name: "Download tarball | registry@{{ registry_name }}"
  ansible.builtin.get_url:
    url: "{{ registry_url }}"
    dest: "{{ registry_install_dir }}/registry.tar.gz"
    mode: 0644
    owner: "{{ registry_owner }}"
    group: "{{ registry_group }}"
    timeout: 30

- name: "Unarchive tarball | registry@{{ registry_name }}"
  ansible.builtin.unarchive:
    src:  "{{ registry_install_dir }}/registry.tar.gz"
    remote_src: true
    dest: "{{ registry_install_dir }}"
    creates: "{{ registry_install_dir }}/registry"
    owner: "{{ registry_owner }}"
    group: "{{ registry_group }}"

# Every file below is named after registry_name, so several instances of this
# role can manage several registries on one host without sharing state. The
# unit refers to the versioned binary directly, which is what makes a
# registry_version bump visible to each instance as a change of its own unit.
- name: "Template service file | registry@{{ registry_name }}"
  ansible.builtin.template:
    src: registry.service.j2
    dest: "/etc/systemd/system/registry-{{ registry_name }}.service"
    mode: 0644
    owner: root
    group: root
  notify:
    - "Restart registry-{{ registry_name }}"

- name: "Template config file | registry@{{ registry_name }}"
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ registry_config_dir }}/{{ registry_name }}.yml"
    mode: 0644
    owner: "{{ registry_owner }}"
    group: "{{ registry_group }}"
  notify:
    - "Restart registry-{{ registry_name }}"

- name: "Enable and start service | registry@{{ registry_name }}"
  ansible.builtin.systemd:
    name: "registry-{{ registry_name }}.service"
    enabled: true
    state: started
    daemon_reload: true

- name: "Create registry garbage collection cronjob | registry@{{ registry_name }}"
  when: registry_garbage_collect_enabled
  ansible.builtin.cron:
    name: "Run registry garbage collection | registry@{{ registry_name }}"
    special_time: "{{ registry_garbage_collect_schedule }}"
    job: "{{ registry_install_dir }}/registry garbage-collect {{ registry_garbage_collect_flags }} {{ registry_config_dir }}/{{ registry_name }}.yml"
